<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Start treasure hunt</title>
</head>
<body>

<h1>Start treasure hunt</h1>

<!-- define empty text area to populate with the uuid later from the API -->
<p id="uuid"></p>

<script>
    // Define parameters as everything after "?" in the url
    // Use location.search for this
    let params = new URLSearchParams(location.search);
    // Read the uuid parameter passed by challenges.html in the query string
    let uuid = params.get("uuid");

    // Display the uuid
    document.getElementById('uuid').innerHTML = uuid;
</script>
</body>

</html>
